n" data-feed="full">3 · Full bottle</button><button type="button" data-feed="receipt">R · Receipt</button><button type="button" data-labels aria-pressed="true">L · Labels on</button></div><div class="rv-guide-start" role="group" aria-label="Step through one cycle"><span>Step through one cycle:</span><button type="button" data-guide="pet">PET bottle</button><button type="button" data-guide="can">Can</button><button type="button" data-guide="full">Full bottle (rejected)</button></div><section class="rv-guide" data-guide-panel hidden aria-live="polite"><div class="rv-guide-head"><span class="rv-guide-step" data-guide-step></span><span class="rv-guide-dots" data-guide-dots></span></div><h3 class="rv-guide-title" data-guide-title></h3><p class="rv-guide-text" data-guide-text></p><div class="rv-guide-nav"><button type="button" data-guide-back>← Back</button><button type="button" class="rv-primary" data-guide-next>Next →</button><button type="button" data-guide-exit>Exit</button></div></section><ol class="rv-legend" data-legend></ol></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>The container being handled: scanned, weighed, sorted and compacted</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Accept path: camera ring, conveyor on a load cell, diverter, compactor or crusher, bin</span><span class="iso-key"><svg class="iso-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Harness from the controller to the cameras, load cell, printer and screen</span></span><span class="iso-caption">A single-feed reverse vending machine, 168 cm tall, with its left side off. Put a container in the round mouth: a ring of six cameras reads the barcode and the deposit mark while the conveyor turns it, and the tracking camera checks its shape. The conveyor rests on a load cell: an empty 0.5 L PET bottle weighs about 19 g and a 0.33 L can about 13 g, so a bottle that still holds half a litre of drink weighs over 500 g and is sent back out. An inductive sensor tells aluminium from plastic, and the diverter flap sends each accepted container to its own path: PET between two toothed rollers, flattened to about 1/2.5 of its volume, and cans under a ram that crushes them to about 1/6, so neither can be returned twice. Each accepted container adds its deposit, 0.25 € here as in Germany and Austria; press the button and the printer issues a voucher for the shop's till.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;

    const count = Math.max(1, rows);

    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));
    run.push(coarse[0]);
    const refine = (a, b, depth) => {
      const mid = levelOf(i, (a.u + b.u) / 2);
      const split = depth < limit && (!same(a, b) || !same(a, mid) || (depth < 6 && strayOf(i, a, mid, b) > error));
      if (!split) {
        run.push(b);
        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const facing = Math.atan2(dot3(F.v, V), dot3(F.u, V));
  const [left, right] = silhouettePoints(side, F, P, { samples, slope });
  if (left.length <= samples || right.length <= samples) return null;
  const s0 = side[0][0];
  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const arc = (s, r, from, to, through) => {
    let sweep = wrap(to - from);
    if (wrap(through - from) > sweep) sweep -= TAU;
    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);
  const n = steps;
  const m = meridian.length;
  const rings = meridian.map(([s, r]) => Array.from({ length: n }, (_, j) => iso(pointOf(F, s, r, (j / n) * TAU), P)));
  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);
      toneRow.push(bandOf(lit));
    }
    seen.push(row);
    tones.push(toneRow);
  }
  const buckets = [[], [], [], [], []];
  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;
    const keys = seen[i].map((visible, j) => (visible ? tones[i][j] : null));
    for (const { key, run } of groupsOf(keys)) {
      const a = run.map((j) => rings[i][j]);
      const b = run.map((j) => rings[i + 1][j]).reverse();
      const d = pathOf(oriented([...a, ...b]), true);
      buckets[key].push(d);
      all.push(d);
    }
  }
  const phi = Math.atan2(vV, uV);
  const flatV = Math.hypot(uV, vV);
  const rangeOf = (i) => {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);
    return ds > 0 ? [Math.max(-1, c), 1] : [-1, Math.min(1, c)];
  };
  const arcsOf = (ranges) => {
    if (ranges.some((range) => !range)) return [];
    const lo = Math.max(...ranges.map(([x]) => x));
    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];
    if (hi >= 1) return [[phi - far, phi + far]];
    if (lo <= -1) return [[phi + near, phi + TAU - near]];
    return [[phi + near, phi + far], [phi - far, phi - near]];
  };
  const along = (s, r, [from, to]) => {
    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, j) => iso(pointOf(F, s, r, from + ((to - from) * j) / count), P));
  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;
    for (const arc of arcsOf([rangeOf(i - 1), rangeOf(i)])) creases.push(pathOf(along(meridian[i][0], meridian[i][1], arc)));
  }
  let bevelPath = "";
  if (bevel > 0 && m > 2) {
    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }
    }
  }
  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;
  if (surface && (fill === "surface" || surface.gap > waist)) {
    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];
  const meridian = [[first[0], 0], ...profile, [last[0], 0]];
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function bandOfProfile(profile, F, P, options = {}) {
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(profile, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);
  });
  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));
    }
    return points;
  };
  return [side(1), side(-1)];
}

const silhouetteOf = (profile, F, P, options = {}) =>
  silhouettePoints(profile, F, P, options)
    .map((points) => pathOf(points.map((point) => iso(point, P))))
    .join("");

function profileCurve(profile, { slope = null, radius = null } = {}) {
  for (let index = 1; index < profile.length; index++) if (profile[index][0] - profile[index - 1][0] <= 1e-9) throw new Error(`profileCurve: s must rise along the profile (point ${index} at s = ${profile[index][0]})`);
  const segments = curveRuns(profile);
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const find = (s) => {
    let lo = 0;
    let hi = profile.length - 2;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (profile[mid][0] <= s) lo = mid;
      else hi = mid - 1;
    }
    return lo;
  };
  const linear = (index, s) => {
    const [sa, ra] = profile[index];
    const [sb, rb] = profile[index + 1];
    return [ra + ((rb - ra) * (s - sa)) / (sb - sa), (rb - ra) / (sb - sa)];
  };

// ------------------------------------------------------------------ cable pulses
function pulse(route, delay = 0, seconds = 0.5) {

}
function drawPulses(dt) {
  const hot = new Set();
  state.pulses = state.pulses.filter((p) => {
    p.t += dt;
    if (p.t < 0) return true;
    const list = routes[p.route];
    const pos = (p.t / p.seconds) * (list.length + 1);
    list.forEach((g, i) => Math.abs(i - pos + 0.5) < 1.1 && hot.add(g));
    return p.t < p.seconds * 1.25;
  });
  for (const list of Object.values(routes)) for (const g of list) g.toggleAttribute("data-hot", hot.has(g));

}

// ------------------------------------------------------------------ the controller's decisions
function events(item, stage) {

  const once = (name, fn) => {
    if (!e[name]) {

      fn();
    }

  if (stage.name === "scan") once("scan", () => {
    pulse("cable.ring", 0, 0.5);

    status.textContent = `${k.label}: reading the barcode.`;
  });
  if (stage.name === "weigh") once("weigh", () => pulse("cable.loadcell", 0, 0.5));
  if (stage.name === "material") once("material", () => {
    if (!k.accept) {

      state.sub = "Please empty the bottle";

      pulse("cable.screen", 0, 0.5);
      status.textContent = `Rejected: ${k.reason}. The bottle comes back out.`;
    }
  });
  if (stage.name === "convey") once("accept", () => {
    state.count++;
    state.total = Math.round((state.total + M.deposit) * 100) / 100;
    state.message = `Accepted +${euro(M.deposit)}`;
    state.sub = item.kind === "can" ? "Aluminium · to the can crusher" : "PET · to the compactor";
    state.tone = "ok";
    pulse("cable.screen", 0, 0.5);
    status.textContent = `Accepted: ${k.label}. Total ${euro(state.total)} for ${state.count} item${state.count === 1 ? "" : "s"}.`;
  });
  if (stage.name === "tilt") once("tilt", () => (state.flap.target = item.kind === "can" ? Math.PI - FLAP_TILT : FLAP_TILT));
  if (stage.name === "slide" && stage.u > 0.7) once("flapBack", () => (state.flap.target = 0));
  if (stage.name === "ramDown" && state.ram >= RAM_CONTACT) once("crushed", () => {});
  if (stage.name === "done") {
    if (item.spot) {
      const bin = item.kind === "can" ? "can" : "pet";
      state.pile[bin].push(item.spot);

    if (!k.accept) state.crate[item.cell] = item.kind, drawCrate();
    state.item = null;
    if (!state.queue.length) {

      state.tone = "idle";

}

function readoutFor(item, stage) {
  const k = KIND[item.kind];
  const n = stage.name;
  if (n === "fly") return `in-feed · ${k.label}`;
  if (n === "insert") return `in-feed · ${k.label}`;
  if (n === "scan") {
    const frames = Math.round(stage.u * T.scan * 1500 * 6 / 10) * 10;
    return stage.u < 0.55 ? `6 cameras · ${frames} frames · reading` : `EAN ${k.ean} · deposit mark ✓`;
  }
  if (n === "weigh") {
    const g = Math.round(k.grams * clamp(stage.u / 0.7));
    return `load cell · ${g} g${stage.u > 0.75 ? (k.grams > M.emptyLimit ? ` · over ${M.emptyLimit} g` : " · empty") : ""}`;
  }
  if (n === "material") return k.material === "aluminium" ? "inductive sensor · metal · aluminium" : "inductive sensor · no metal · PET";
  if (n === "back") return `rejected · ${k.grams} g · ${k.reason}`;
  if (n === "return") return `returned · ${k.reason}`;
  if (n === "convey") return `accepted · +${euro(M.deposit)} · total ${euro(state.total)}`;
  if (n === "drop" || n === "tilt" || n === "slide") return `diverter · ${item.kind === "can" ? "← cans" : "PET →"}`;

}

}

// ------------------------------------------------------------------ actuators follow their targets
function follow(cur, target, dt, tau, calm) {
  if (calm) return target;
  const v = cur + (target - cur) * (1 - Math.exp(-dt / tau));

}
function actuators(dt, calm) {
  const it = state.item;
  const st = it ? stageOf(it) : null;
  const n = st?.name;
  // belt
  const beltWant = n === "insert" || n === "convey" ? 1 : n === "back" ? -1 : n === "scan" ? 0.15 : 0;
  state.belt.speed = follow(state.belt.speed, beltWant, dt, 0.12, calm);
  state.belt.phase += state.belt.speed * dt * 70;
  // rollers spin while shredding
  const rollWant = n === "settle" || n === "shred" || n === "fall" && it?.kind !== "can" ? 1 : 0;
  state.rollers.speed = follow(state.rollers.speed, rollWant, dt, 0.25, calm);
  state.rollers.phase += state.rollers.speed * dt * 5;
  // flap
  state.flap.angle = follow(state.flap.angle, state.flap.target, dt, 0.07, calm);
  // ram and trapdoor
  let ramWant = 0;
  if (n === "ramDown") ramWant = RAM_MAX * ease(st.u / 0.9);

  state.door = n === "door" || (n === "fall" && it?.kind === "can") ? doorWant : follow(state.door, 0, dt, 0.08, calm);
  // receipt paper
  state.paper.length = follow(state.paper.length, state.paper.target, dt, state.paper.target > state.paper.length ? 0.45 : 0.12, calm);
  state.press = follow(state.press, state.clock - state.paper.at < 0.18 ? 1 : 0, dt, 0.04, calm);
  // LEDs
  const on = (name, value) => el.led[name]?.toggleAttribute("data-on", !!value);
  on("ring", n === "scan" || n === "insert");
  on("metal", n === "material" && it?.kind === "can");
  on("div", n === "tilt" || n === "slide");
  on("printer", state.paper.length < state.paper.target - 0.2);
  on("pcb", Math.floor(state.clock * 2) % 2 === 0);
  svg.querySelector('[data-part="gauge"]')?.closest(".it")?.toggleAttribute("data-on", n === "weigh");
  svg.querySelector('[data-part="loadcell"]')?.closest(".it")?.toggleAttribute("data-on", n === "weigh");
  for (const g of $$("[data-pod]")) g.closest(".it")?.toggleAttribute("data-on", n === "scan");

  return moving;
}

function receipt() {

  state.paper.at = state.clock;
  if (state.item || state.queue.length) {
    say("finish the container first");
    run();
    return;
  }
  if (state.total <= 0) {

    state.paper.target = 0;
    run();
    return;
  }
  state.paper.items = state.count;
  state.paper.total = state.total;
  state.paper.target = 22 + state.count * 2.4;
  say(`printing voucher · ${state.count} item${state.count === 1 ? "" : "s"} · ${euro(state.total)}`);
  status.textContent = `Voucher printed for ${euro(state.total)}. Take it to the till.`;
  pulse("cable.printer", 0, 0.5);
  state.message = "Thank you!";

// ------------------------------------------------------------------ loop
let frame = 0;
let last = 0;
let visible = false;
let touring = !still.matches;
let tourClock = 0;
let tourIndex = 0;
let idle = 0;
const TOUR = [
  [1.0, () => feedKind("pet")],
  [9.6, () => feedKind("can")],
  [19, () => feedKind("full")],
  [26, () => feedKind("pet")],
  [35.2, () => receipt()],
  [42, null],
];
function tourStep(dt) {
  tourClock += dt;
  while (tourIndex < TOUR.length && tourClock >= TOUR[tourIndex][0]) {
    const action = TOUR[tourIndex][1];
    tourIndex++;
    if (action) action();
    else {
      tourClock = 0;
      tourIndex = 0;
      refillCrate();
      if (state.pile.pet.length + state.pile.can.length > 30) {
        state.pile = { pet: [], can: [] };
        drawPiles();
      }
    }
  }
}
function tick(now) {

  state.clock += dt;
  if (touring) tourStep(dt);
  if (state.item) {
    state.item.t += calm ? 0.25 : dt;
    if (guide.on && state.item.t > guide.hold) state.item.t = guide.hold;
    const st = stageOf(state.item);
    events(state.item, st);
    if (state.item) say(readoutFor(state.item, stageOf(state.item)));
  } else if (!state.paper.target && state.clock - state.paper.at > 2) say(state.total > 0 ? `${state.count} item${state.count === 1 ? "" : "s"} · ${euro(state.total)} · press R for the voucher` : "ready · insert a container");
  const moving = actuators(dt, calm);
  drawFlap();
  drawRam();
  drawBelt();
  drawRollers();
  drawItem();
  drawScreen();
  drawButton();
  drawPaper();
  guideTick();
  drawLabels();
  const pulsing = drawPulses(dt);
  if (!calm && el.fan) el.fan.setAttribute("transform", `rotate(${((state.clock * 220) % 360).toFixed(1)})`);
  const alive = touring || state.item || state.queue.length || moving || pulsing || (state.total > 0 && !calm);
  frame = visible && alive ? requestAnimationFrame(tick) : 0;
}
function run() {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
}
function takeOverSoon() {
  touring = false;
  clearTimeout(idle);
  idle = setTimeout(() => {
    if (still.matches || guide.on) return;
    touring = true;
    tourClock = 0;
    tourIndex = 0;
    run();
  }, 20000);
}
new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);

stage.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const key = event.key.toLowerCase();
  const kinds = { 1: "pet", 2: "can", 3: "full" };
  if (key === "l") {
    event.preventDefault();
    setLabels(!labels.on);
  } else if (guide.on && (key === "arrowright" || key === " ")) {
    event.preventDefault();
    guideNext();
  } else if (guide.on && key === "arrowleft") {
    event.preventDefault();
    guideBack();
  } else if (guide.on && key === "escape") {
    event.preventDefault();
    guideExit();
  } else if (guide.on) {
    return;
  } else if (kinds[key]) {
    event.preventDefault();
    takeOverSoon();
    feedKind(kinds[key]);
  } else if (key === "r" || key === "enter") {
    event.preventDefault();
    receipt();
  }
});
svg.addEventListener("click", (event) => {
  const pick = event.target.closest("[data-cell]");
  const bin = event.target.closest("[data-bin]");

const STAGE_STATIONS = { fly: ["mouth"], insert: ["mouth"], scan: ["ring", "cam"], weigh: ["loadcell"], material: ["metal"], convey: ["screen"], drop: ["diverter"], tilt: ["diverter"], slide: ["diverter"], settle: ["compactor"], shred: ["compactor"], ramDown: ["crusher"], ramUp: ["crusher"], door: ["bincan"], back: ["mouth", "screen"], return: ["mouth", "screen"] };

  const k = KIND[kind];
  const insert = { title: "Insert the container", until: "fly", stations: ["mouth"], text: `The customer pushes the ${kind === "can" ? "can" : "bottle"} into the round in-feed (1), bottom first. The conveyor starts and draws it inside, past the camera ring.` };
  const scan = { title: "Read the barcode and deposit mark", until: "scan", stations: ["ring", "cam"], text: `A ring of six cameras (2) photographs the container from every side, up to 1,500 frames a second, while it turns. It reads the EAN barcode (${k.ean}) and looks for the deposit logo. A second camera above the belt (3) checks the shape and length against the database.` };
  const weigh = { title: "Weigh it", until: "weigh", stations: ["loadcell"], text: k.accept ? `The conveyor rests on a load cell (4), a metal beam with strain gauges that bends slightly under the load. This ${kind === "can" ? "can" : "bottle"} weighs ${k.grams} g, which matches an empty container, so nothing is left inside.` : `The load cell (4) reads ${k.grams} g. An empty 0.5 L bottle weighs about 19 g, so this one still holds about half a litre of drink. The machine will not accept it: liquid would spill into the bin and the weight could be used to cheat.` };
  if (!k.accept) {
    const reject = { title: "Reject and return", until: "return", stations: ["screen", "mouth"], text: "The screen (6) shows “Not accepted · please empty the bottle”, and the conveyor runs backwards to hand the bottle out through the in-feed (1). No deposit is credited." };
    return [insert, scan, weigh, reject];
  }
  const material = { title: "Check the material", until: "material", stations: ["metal"], text: kind === "can" ? "The inductive sensor beside the belt (5) makes a small magnetic field. Metal disturbs it, so its light comes on: this is aluminium, which confirms what the barcode said." : "The inductive sensor beside the belt (5) reacts only to metal. Its light stays off, so this is plastic (PET), which confirms what the barcode said." };
  const credit = { title: "Accept and credit the deposit", until: "convey", stations: ["screen"], text: `Every check passed. The controller (13) adds the deposit, ${euro(M.deposit)}, and the screen (6) shows the running total while the belt carries the container to its end.` };
  const sort = { title: "Sort by material", until: "slide", stations: ["diverter"], text: `The container drops onto the diverter flap (7). A solenoid tips the flap ${kind === "can" ? "toward the back, to the can crusher" : "toward the front, to the PET compactor"}, so plastic and metal never mix.` };
  const squash = kind === "can"
    ? { title: "Crush the can", until: "ramUp", stations: ["crusher"], text: "A hydraulic ram (9) presses the can flat on its anvil, to about 1/6 of its volume. A crushed can cannot be inserted again for a second deposit, and the bins hold six times more." }
    : { title: "Flatten the bottle", until: "shred", stations: ["compactor"], text: "Two toothed rollers (8) turning toward each other grab the bottle, pierce it and squeeze it flat, to about 1/2.5 of its volume. A flattened bottle cannot be inserted again for a second deposit." };
  const store = { title: "Store it", until: "fall", stations: [kind === "can" ? "bincan" : "binpet"], text: kind === "can" ? "The trapdoor under the anvil opens and the flat can drops into the can bin (11). The gauge on the bin shows how full it is; staff empty it through the service door." : "The flattened bottle falls into the PET bin (10). The gauge on the bin shows how full it is; staff empty it through the service door." };
  const voucher = { title: "Print the voucher", until: "done", stations: ["printer"], text: "When the customer presses the round button, the thermal printer behind the slot (12) prints a voucher with the item count and the total. It is paid out at the shop's till, and the screen resets to 0.00 €." };
  return [insert, scan, weigh, material, credit, sort, squash, store, voucher];
}
function endOf(item, stageName) {
  const steps = schedule(item);
  let t = 0;
  for (const [name, d] of steps) {
    t += d;
    if (name === stageName) return t - 0.001;
  }
  return Infinity;
}
function guideStart(kind) {
  touring = false;
  clearTimeout(idle);
  state.queue = [];
  state.item = null;
  state.flap.target = 0;
  state.paper.target = 0;
  state.count = 0;
  state.total = 0;
  state.message = "Insert a bottle or can";
  state.sub = "";
  state.tone = "idle";
  refillCrate();
  guide.on = true;
  stage.classList.add("rv-guiding");
  guide.kind = kind;
  guide.steps = stepsFor(kind);
  guide.step = 0;
  guide.printed = false;
  guide.hold = 0;
  panel.hidden = false;
  document.querySelector(".rv-guide-start").classList.add("rv-dim-row");
  feedKind(kind);
  applyStep();
  panel.scrollIntoView?.({ block: "nearest", behavior: still.matches ? "auto" : "smooth" });
  run();
}
function applyStep() {
  const st = guide.steps[guide.step];
  if (state.item) guide.hold = endOf(state.item, st.until);
  if (st.until === "done") guide.hold = Infinity;
  gStep.textContent = `Step ${guide.step + 1} of ${guide.steps.length}`;
  gDots.innerHTML = guide.steps.map((_, i) => `<i${i === guide.step ? " data-on" : i < guide.step ? " data-done" : ""}></i>`).join("");
  gTitle.textContent = st.title;
  gText.textContent = st.text;
  gBack.disabled = guide.step === 0;
  const last = guide.step === guide.steps.length - 1;
  gNext.textContent = last ? "Finish" : "Next →";
  status.textContent = `Step ${guide.step + 1}: ${st.title}. ${st.text}`;
  labels.active = null;
  run();
}
function guideNext() {
  if (guide.step >= guide.steps.length - 1) return guideExit();
  guide.step++;
  applyStep();
}
function guideBack() {
  if (guide.step === 0 || !state.item) return;
  guide.step--;
  const prevEnd = guide.step > 0 ? endOf(state.item, guide.steps[guide.step - 1].until) : 0;
  state.item.t = Math.min(state.item.t, prevEnd + 0.002);
  for (const e of ["tilt", "flapBack", "crushed"]) delete state.item.events[e];
  if (stageOf(state.item).name !== "slide") state.flap.target = 0;
  applyStep();
}
function guideTick() {
  if (!guide.on) return;
  const st = guide.steps[guide.step];
  if (st.until === "done" && !state.item && !guide.printed && state.total > 0) {
    guide.printed = true;
    receipt();
  }
}
function guideExit() {
  guide.on = false;
  stage.classList.remove("rv-guiding");
  guide.hold = Infinity;
  panel.hidden = true;
  document.querySelector(".rv-guide-start").classList.remove("rv-dim-row");
  labels.active = null;
  takeOverSoon();
  run();
}
document.querySelectorAll("[data-guide]").forEach((b) => b.addEventListener("click", () => guideStart(b.dataset.guide)));
gNext.addEventListener("click", guideNext);
gBack.addEventListener("click", guideBack);
document.querySelector("[data-guide-exit]").addEventListener("click", guideExit);

for (let i = 0; i < 6; i++) state.pile.pet.push(pileSpot("pet", i));
for (let i = 0; i < 8; i++) state.pile.can.push(pileSpot("can", i));
drawCrate();
drawPiles();
drawFlap();
drawRam();
drawBelt();
drawRollers();
drawScreen();
drawButton();
if (still.matches) touring = false;
</script></body></html>
